name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install package test dependencies
        run: npm ci
      - name: Test package
        run: npm test
      - name: Inspect package contents
        run: npm pack --dry-run

  wiki:
    name: Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wiki/package-lock.json
      - name: Install wiki dependencies
        run: npm ci --prefix wiki
      - name: Build wiki
        run: npm run build --prefix wiki
